name: Release unsigned IPA

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: unsigned-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project placard.xcodeproj \
            -scheme placard \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/placard.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/placard.xcarchive/Products/Applications/placard.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry "placard-${GITHUB_REF_NAME}-unsigned.ipa" Payload

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Placard ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ runner.temp }}/placard-${{ github.ref_name }}-unsigned.ipa
