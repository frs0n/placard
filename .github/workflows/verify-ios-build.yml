name: Verify iOS build

on:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: ./scripts/prepare-airlift.sh
      - run: |
          xcodebuild build \
            -project placard.xcodeproj \
            -scheme placard \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
